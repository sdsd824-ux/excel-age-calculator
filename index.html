<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>환자 방문 분석</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}

h1{
margin-bottom:10px;
}

#dropZone{
border:2px dashed #9aa4b2;
background:white;
padding:40px;
text-align:center;
cursor:pointer;
}

#dropZone.drag{
border-color:#4a8cff;
background:#eef4ff;
}

.stats{
display:flex;
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:15px 20px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.filter{
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#f1f3f5;
}

.one{
background:#ffe5e5;
}

</style>
</head>
<body>

<h1>환자 방문 분석</h1>

<div id="dropZone">
엑셀 파일을 드래그하거나 클릭하세요
</div>

<input type="file" id="fileInput" hidden>

<div class="stats">
<div class="card">총 환자 : <span id="total">0</span></div>
<div class="card">재방문율 : <span id="returnRate">0%</span></div>
</div>

<div class="filter">
N차 이상 필터
<input type="number" id="nFilter" value="1" min="1">
<button onclick="applyFilter()">적용</button>
</div>

<table id="result">
<thead>
<tr>
<th>차트번호</th>
<th>수진자명</th>
<th>첫 내원일</th>
<th>마지막 방문</th>
<th>경과일</th>
<th>방문횟수</th>
<th>평균 방문간격</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h3 style="margin-top:40px">월별 방문 횟수</h3>

<table id="monthly">
<thead>
<tr>
<th>월</th>
<th>횟수</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

let analyzedPatients = [];

dropZone.onclick = () => fileInput.click();

dropZone.addEventListener("dragover", e=>{
e.preventDefault();
dropZone.classList.add("drag");
});

dropZone.addEventListener("dragleave", ()=>{
dropZone.classList.remove("drag");
});

dropZone.addEventListener("drop", e=>{
e.preventDefault();
dropZone.classList.remove("drag");
handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", e=>{
handleFile(e.target.files[0]);
});

function handleFile(file){

const reader = new FileReader();

reader.onload = function(e){

const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data,{type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];

const rows = XLSX.utils.sheet_to_json(sheet,{header:1});

processRows(rows);

};

reader.readAsArrayBuffer(file);

}

function processRows(rows){

let headerRow=-1;

for(let r=0;r<rows.length;r++){

for(let c=0;c<rows[r].length;c++){

let cell = String(rows[r][c] || "");

if(cell.includes("차트번호")){
headerRow = r;
break;
}

}

if(headerRow!==-1) break;

}

if(headerRow===-1){
alert("차트번호 헤더를 찾지 못했습니다");
return;
}

const headers = rows[headerRow];

let dataRows = rows.slice(headerRow+1);

let json = dataRows.map(row=>{
let obj={};

headers.forEach((h,i)=>{
if(!h) return;
obj[String(h).trim()] = row[i];
});

return obj;
});

analyze(json);

}

function analyze(data){

const chartCol="차트번호";
const nameCol="수진자명";
const dateCol="내원일";

let patients={};
let monthly={};

data.forEach(row=>{

let id=row[chartCol];
let name=row[nameCol] || "";
let dateValue=row[dateCol];

if(!id || !dateValue) return;

let date=new Date(dateValue);

if(!patients[id]) patients[id]={name, visits:[]};

patients[id].visits.push(date);

let month=date.toISOString().slice(0,7);
monthly[month]=(monthly[month]||0)+1;

});

analyzedPatients=[];

let today = new Date();

Object.keys(patients).forEach(id=>{

let visits = patients[id].visits.sort((a,b)=>a-b);

let first = visits[0];
let last = visits[visits.length-1];
let count = visits.length;

let daysSince = Math.floor((today-last)/(1000*60*60*24));

let avgGap="-";

if(count>1){

let gaps=[];

for(let i=1;i<count;i++){

let diff=(visits[i]-visits[i-1])/(1000*60*60*24);
gaps.push(diff);

}

avgGap=(gaps.reduce((a,b)=>a+b)/gaps.length).toFixed(1)+"일";

}

analyzedPatients.push({
id,
name:patients[id].name,
first,
last,
daysSince,
count,
avgGap
});

});

renderTable(analyzedPatients);
renderMonthly(monthly);

let total = analyzedPatients.length;
let returnPatients = analyzedPatients.filter(p=>p.count>1).length;

document.getElementById("total").innerText = total;
document.getElementById("returnRate").innerText = Math.round(returnPatients/total*100)+"%";

}

function renderTable(list){

const tbody = document.querySelector("#result tbody");
tbody.innerHTML="";

list.forEach(p=>{

let tr=document.createElement("tr");

if(p.count===1) tr.classList.add("one");

tr.innerHTML=`
<td>${p.id}</td>
<td>${p.name}</td>
<td>${p.first.toISOString().slice(0,10)}</td>
<td>${p.last.toISOString().slice(0,10)}</td>
<td>${p.daysSince}일</td>
<td>${p.count}</td>
<td>${p.avgGap}</td>
`;

tbody.appendChild(tr);

});

}

function renderMonthly(data){

const tbody=document.querySelector("#monthly tbody");
tbody.innerHTML="";

Object.keys(data).sort().forEach(m=>{

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${m}</td>
<td>${data[m]}</td>
`;

tbody.appendChild(tr);

});

}

function applyFilter(){

let n=parseInt(document.getElementById("nFilter").value);

let filtered = analyzedPatients.filter(p=>p.count>=n);

renderTable(filtered);

}

</script>

</body>
</html>
