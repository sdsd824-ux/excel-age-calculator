<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>만 나이 계산기</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f5f7fb;
  margin:0;
}

.header{
  text-align:center;
  padding:60px 20px 30px;
}

.header h1{
  margin:10px 0;
}

.container{
  width:900px;
  margin:auto;
}

.upload-area{
  display:flex;
  gap:30px;
  margin-top:40px;
}

.box{
  flex:1;
  border:2px dashed #cfcfcf;
  border-radius:12px;
  padding:40px;
  text-align:center;
  background:white;
  transition:0.2s;
}

.box:hover{
  background:#eef4ff;
}

.fileInput{
  margin-top:20px;
}

table{
  border-collapse: collapse;
  width:100%;
  margin-top:40px;
  background:white;
}

th, td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}

th{
  background:#f0f0f0;
}

</style>
</head>

<body>

<div class="header">
  <h1>만 나이 계산 시스템</h1>
  <p>엑셀 파일을 업로드하면 자동으로 계산됩니다</p>
</div>

<div class="container">

  <div class="upload-area">

    <div class="box">
      <h3>엑셀 업로드</h3>
      <p>파일을 선택하세요</p>
      <input type="file" id="upload" class="fileInput"/>
    </div>

    <div class="box">
      <h3>설명</h3>
      <p>엑셀에 <b>출생연도</b> 컬럼이 있어야 합니다</p>
      <p>자동으로 만나이가 계산됩니다</p>
    </div>

  </div>

  <div id="resultTable"></div>

</div>

<script>

document.getElementById('upload').addEventListener('change', function(e) {

  const reader = new FileReader();

  reader.onload = function(event) {

    const data = new Uint8Array(event.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    const today = new Date();
    const currentYear = today.getFullYear();

    const birthCol = "출생연도";

    const result = json.map(row => {
      const birthYear = row[birthCol] || null;
      const age = birthYear ? currentYear - birthYear : null;
      return {...row, 만나이: age};
    });

    const tableDiv = document.getElementById('resultTable');

    if(result.length === 0){
      tableDiv.innerHTML = "<p>데이터가 없습니다.</p>";
      return;
    }

    let html = '<table>';

    html += '<tr>';
    for (const key in result[0]) {
      html += `<th>${key}</th>`;
    }
    html += '</tr>';

    result.forEach(row => {
      html += '<tr>';
      for (const key in row) {
        html += `<td>${row[key] !== undefined ? row[key] : ""}</td>`;
      }
      html += '</tr>';
    });

    html += '</table>';

    tableDiv.innerHTML = html;

  };

  reader.readAsArrayBuffer(e.target.files[0]);

});

</script>

</body>
</html>
