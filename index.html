<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>만 나이 계산기</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 5px; text-align: center; }
    th { background-color: #f0f0f0; }
  </style>
</head>
<body>

<h2>엑셀 업로드 (출생연도 기준 만나이 계산)</h2>
<input type="file" id="upload" />
<div id="resultTable"></div>

<script>
document.getElementById('upload').addEventListener('change', function(e) {
  const reader = new FileReader();
  reader.onload = function(event) {
    const data = new Uint8Array(event.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    const today = new Date();
    const currentYear = today.getFullYear();

    const birthCol = "출생연도";

    const result = json.map(row => {
      const birthYear = row[birthCol] || null;
      const age = birthYear ? currentYear - birthYear : null;
      return {...row, 만나이: age};
    });

    // 웹페이지에 표로 출력
    const tableDiv = document.getElementById('resultTable');
    if(result.length === 0){
      tableDiv.innerHTML = "<p>데이터가 없습니다.</p>";
      return;
    }

    let html = '<table>';
    // 헤더
    html += '<tr>';
    for (const key in result[0]) {
      html += `<th>${key}</th>`;
    }
    html += '</tr>';
    // 데이터 행
    result.forEach(row => {
      html += '<tr>';
      for (const key in row) {
        html += `<td>${row[key] !== undefined ? row[key] : ""}</td>`;
      }
      html += '</tr>';
    });
    html += '</table>';
    tableDiv.innerHTML = html;

  };
  reader.readAsArrayBuffer(e.target.files[0]);
});
</script>

</body>
</html>
