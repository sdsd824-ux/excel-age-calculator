<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>환자 재내원 분석</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family: Arial;
margin:40px;
}

#drop{
border:2px dashed #999;
padding:40px;
text-align:center;
cursor:pointer;
}

table{
border-collapse: collapse;
width:100%;
margin-top:20px;
}

th,td{
border:1px solid #333;
padding:6px;
text-align:center;
}

th{
background:#f2f2f2;
}

.once{
background:#ffe6e6;
font-weight:bold;
}

.stat{
margin-top:20px;
font-size:18px;
}

</style>
</head>

<body>

<h2>엑셀 업로드</h2>

<div id="drop">
파일 드래그 또는 클릭 업로드
<input type="file" id="file" style="display:none">
</div>

<div class="stat" id="stats"></div>

<label>N차 필터</label>
<select id="nFilter">
<option value="0">전체</option>
<option value="1">1회</option>
<option value="2">2회 이상</option>
<option value="3">3회 이상</option>
<option value="5">5회 이상</option>
<option value="10">10회 이상</option>
</select>

<div id="result"></div>

<script>

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");

drop.onclick=()=>fileInput.click();

drop.ondragover=(e)=>{e.preventDefault();}
drop.ondrop=(e)=>{
e.preventDefault();
handleFile(e.dataTransfer.files[0]);
};

fileInput.onchange=(e)=>{
handleFile(e.target.files[0]);
};

let patientData=[];

function handleFile(file){

const reader=new FileReader();

reader.onload=function(e){

const data=new Uint8Array(e.target.result);
const wb=XLSX.read(data,{type:"array"});
const sheet=wb.Sheets[wb.SheetNames[0]];

const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

process(rows);

};

reader.readAsArrayBuffer(file);

}

function safeDate(v){

if(!v) return null;

v=String(v).trim();

if(v=="" || v.includes("내원일")) return null;

let d=new Date(v);

if(isNaN(d)) return null;

return d;

}

function process(rows){

let chartIndex=-1;
let nameIndex=-1;
let dateIndex=-1;

for(let r of rows){

for(let i=0;i<r.length;i++){

let cell=String(r[i]);

if(cell.includes("차트번호")) chartIndex=i;
if(cell.includes("수진자명")) nameIndex=i;
if(cell.includes("내원일")) dateIndex=i;

}

if(chartIndex>-1 && dateIndex>-1) break;

}

let map={};

rows.forEach(r=>{

let chart=r[chartIndex];
let name=r[nameIndex];
let visit=safeDate(r[dateIndex]);

if(!chart || !visit) return;

if(!map[chart]){

map[chart]={
chart:chart,
name:name,
dates:[]
};

}

map[chart].dates.push(visit);

});

patientData=Object.values(map).map(p=>{

p.dates.sort((a,b)=>a-b);

let first=p.dates[0];
let last=p.dates[p.dates.length-1];
let count=p.dates.length;

let gaps=[];

for(let i=1;i<p.dates.length;i++){

gaps.push((p.dates[i]-p.dates[i-1])/(1000*60*60*24));

}

let avgGap=gaps.length? (gaps.reduce((a,b)=>a+b)/gaps.length).toFixed(1):"-";

let today=new Date();

let sinceLast=Math.floor((today-last)/(1000*60*60*24));

let monthMap={};

p.dates.forEach(d=>{

let key=d.getFullYear()+"-"+(d.getMonth()+1);

monthMap[key]=(monthMap[key]||0)+1;

});

return{
chart:p.chart,
name:p.name,
first:first.toISOString().slice(0,10),
last:last.toISOString().slice(0,10),
count:count,
avgGap:avgGap,
sinceLast:sinceLast,
months:monthMap
};

});

render();

}

document.getElementById("nFilter").onchange=render;

function render(){

let n=parseInt(document.getElementById("nFilter").value);

let list=patientData.filter(p=>{

if(n==0) return true;

if(n==1) return p.count==1;

return p.count>=n;

});

let html="<table>";

html+=`
<tr>
<th>차트번호</th>
<th>수진자명</th>
<th>첫 방문</th>
<th>마지막 방문</th>
<th>총 방문</th>
<th>평균 방문간격</th>
<th>마지막 방문후 경과일</th>
</tr>
`;

list.forEach(p=>{

let cls=p.count==1?"once":"";

html+=`
<tr class="${cls}">
<td>${p.chart}</td>
<td>${p.name||""}</td>
<td>${p.first}</td>
<td>${p.last}</td>
<td>${p.count}</td>
<td>${p.avgGap}</td>
<td>${p.sinceLast}</td>
</tr>
`;

});

html+="</table>";

document.getElementById("result").innerHTML=html;

calcStats();

}

function calcStats(){

let total=patientData.length;

let revisit=patientData.filter(p=>p.count>1).length;

let rate=((revisit/total)*100).toFixed(1);

let monthCount={};

patientData.forEach(p=>{

for(let m in p.months){

monthCount[m]=(monthCount[m]||0)+p.months[m];

}

});

let statHTML=`
전체 환자 : ${total}명<br>
재방문 환자 : ${revisit}명<br>
재방문율 : ${rate}%<br><br>
`;

statHTML+="월별 치료 횟수<br>";

for(let m in monthCount){

statHTML+=`${m} : ${monthCount[m]}회<br>`;

}

document.getElementById("stats").innerHTML=statHTML;

}

</script>

</body>
</html>
