<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>환자 내원 분석</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
font-family: Arial;
background:#f4f6fb;
margin:0;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:10px;
}

.sub{
text-align:center;
margin-bottom:40px;
color:#666;
}

.upload{
border:2px dashed #bfc7d9;
padding:40px;
text-align:center;
background:white;
border-radius:12px;
margin-bottom:40px;
}

.stats{
font-size:20px;
margin-bottom:20px;
line-height:1.8;
}

table{
width:100%;
border-collapse:collapse;
background:white;
font-size:18px;
}

th{
background:#eef1f7;
padding:12px;
border:1px solid #ddd;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

.highlight{
background:#ffe9e9;
font-weight:bold;
}

.filter{
margin:20px 0;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>환자 내원 분석</h1>
<div class="sub">엑셀 파일을 넣으면 자동 분석됩니다</div>

<div class="upload">
<input type="file" id="excelFile">
</div>

<div class="stats" id="stats"></div>

<div class="filter">
N차 필터
<select id="visitFilter">
<option value="all">전체</option>
<option value="1">1회</option>
<option value="2">2회</option>
<option value="3">3회 이상</option>
</select>
</div>

<table id="table">
<thead>
<tr>
<th>차트번호</th>
<th>수진자명</th>
<th>방문횟수</th>
<th>첫 방문</th>
<th>마지막 방문</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

document.getElementById('excelFile').addEventListener('change', handleFile)

let patientData=[]

function handleFile(e){

const file=e.target.files[0]
const reader=new FileReader()

reader.onload=function(evt){

const data=new Uint8Array(evt.target.result)
const workbook=XLSX.read(data,{type:'array'})
const sheet=workbook.Sheets[workbook.SheetNames[0]]

const rows=XLSX.utils.sheet_to_json(sheet,{header:1})

analyze(rows)

}

reader.readAsArrayBuffer(file)

}

function analyze(rows){

let headers=[]
let startRow=0

for(let i=0;i<rows.length;i++){

const r=rows[i]

if(r.includes("수진자명")||r.includes("환자명")){
headers=r
startRow=i+1
break
}

}

let nameIndex=headers.findIndex(h=>h=="수진자명"||h=="환자명")
let dateIndex=headers.findIndex(h=>h=="내원일"||h=="날짜")
let chartIndex=headers.findIndex(h=>h=="차트번호")

let map={}

for(let i=startRow;i<rows.length;i++){

const r=rows[i]
if(!r[nameIndex]) continue

let name=r[nameIndex]
let date=new Date(r[dateIndex])
let chart=r[chartIndex]||"-"

if(!map[name]){

map[name]={
chart:chart,
visits:[]
}

}

map[name].visits.push(date)

}

patientData=Object.entries(map).map(([name,obj])=>{

obj.visits.sort((a,b)=>a-b)

return{
name,
chart:obj.chart,
count:obj.visits.length,
first:obj.visits[0],
last:obj.visits[obj.visits.length-1]
}

})

render()

}

function render(){

const tbody=document.querySelector("#table tbody")
tbody.innerHTML=""

const filter=document.getElementById("visitFilter").value

let total=patientData.length
let revisit=patientData.filter(p=>p.count>1).length

patientData.forEach(p=>{

if(filter=="1" && p.count!=1) return
if(filter=="2" && p.count!=2) return
if(filter=="3" && p.count<3) return

let tr=document.createElement("tr")

if(p.count==1) tr.classList.add("highlight")

tr.innerHTML=`
<td>${p.chart}</td>
<td>${p.name}</td>
<td>${p.count}</td>
<td>${format(p.first)}</td>
<td>${format(p.last)}</td>
`

tbody.appendChild(tr)

})

document.getElementById("stats").innerHTML=`
전체 환자 : ${total}명<br>
재방문 환자 : ${revisit}명<br>
재방문율 : ${((revisit/total)*100).toFixed(1)}%
`

}

function format(d){

return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")

}

document.getElementById("visitFilter").addEventListener("change",render)

</script>

</body>
</html>
