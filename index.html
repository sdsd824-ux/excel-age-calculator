<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>엑셀 만나이 계산</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f6f8fb;
}

.header{
text-align:center;
padding:70px 20px 30px;
}

.title{
font-size:26px;
}

.container{
width:1000px;
margin:40px auto;
}

.upload-box{
background:white;
border:2px dashed #cfcfcf;
border-radius:14px;
padding:60px;
text-align:center;
transition:.2s;
cursor:pointer;
}

.upload-box.dragover{
background:#eef4ff;
border-color:#6ea8ff;
}

table{
width:100%;
border-collapse: collapse;
margin-top:40px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#f1f3f5;
}

</style>
</head>

<body>

<div class="header">
<div class="title">엑셀 만나이 계산</div>
</div>

<div class="container">

<div id="dropZone" class="upload-box">
파일을 여기에 드래그하거나 클릭하여 업로드
<br><br>
<input type="file" id="upload" hidden>
</div>

<div id="resultTable"></div>

</div>

<script>

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("upload");

dropZone.addEventListener("click",()=>{
fileInput.click();
});

fileInput.addEventListener("change",(e)=>{
handleFile(e.target.files[0]);
});

dropZone.addEventListener("dragover",(e)=>{
e.preventDefault();
dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave",()=>{
dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop",(e)=>{
e.preventDefault();
dropZone.classList.remove("dragover");
handleFile(e.dataTransfer.files[0]);
});

function handleFile(file){

const reader = new FileReader();

reader.onload = function(event){

const data = new Uint8Array(event.target.result);
const workbook = XLSX.read(data,{type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
const json = XLSX.utils.sheet_to_json(sheet);

const currentYear = new Date().getFullYear();

const result = json.map(row=>{
const birthYear = row["출생연도"];
const age = birthYear ? currentYear - birthYear : "";
return {...row, 만나이:age};
});

renderTable(result);

};

reader.readAsArrayBuffer(file);

}

function renderTable(data){

if(data.length===0){
document.getElementById("resultTable").innerHTML="데이터 없음";
return;
}

let html="<table>";

html+="<tr>";
for(const key in data[0]){
html+=`<th>${key}</th>`;
}
html+="</tr>";

data.forEach(row=>{
html+="<tr>";
for(const key in row){
html+=`<td>${row[key]??""}</td>`;
}
html+="</tr>";
});

html+="</table>";

document.getElementById("resultTable").innerHTML=html;

}

</script>

</body>
</html>
