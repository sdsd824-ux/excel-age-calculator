<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>환자 내원 분석</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family: Arial;
background:#f6f7fb;
text-align:center;
padding:40px;
}

h1{
margin-bottom:10px;
}

#drop{
width:420px;
margin:30px auto;
padding:40px;
border:2px dashed #bfc6d1;
border-radius:10px;
background:white;
}

table{
border-collapse:collapse;
margin:40px auto;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px 14px;
}

th{
background:#f2f4f8;
}

.one{
background:#ffecec;
font-weight:bold;
}

</style>
</head>

<body>

<h1>환자 내원 분석</h1>
<p>엑셀 파일을 넣으면 자동 분석됩니다</p>

<div id="drop">
파일을 드래그하거나 클릭해서 업로드<br><br>
<input type="file" id="upload">
</div>

<div id="result"></div>

<script>

const drop = document.getElementById("drop");
const upload = document.getElementById("upload");

drop.addEventListener("dragover",e=>{
e.preventDefault();
drop.style.background="#eef2ff";
});

drop.addEventListener("dragleave",e=>{
drop.style.background="white";
});

drop.addEventListener("drop",e=>{
e.preventDefault();
drop.style.background="white";
handleFile(e.dataTransfer.files[0]);
});

upload.addEventListener("change",e=>{
handleFile(e.target.files[0]);
});

function handleFile(file){

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data,{type:"array"});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
const rows = XLSX.utils.sheet_to_json(sheet,{header:1});

processRows(rows);

};

reader.readAsArrayBuffer(file);

}

function findHeader(rows){

for(let i=0;i<rows.length;i++){

let r = rows[i];
if(!r) continue;

let hasChart = r.includes("차트번호");
let hasDate = r.includes("내원일");

if(hasChart && hasDate){
return i;
}

}

return -1;

}

function excelDateToJS(n){

let utc_days = Math.floor(n - 25569);
let utc_value = utc_days * 86400;
let date = new Date(utc_value * 1000);
return date;

}

function safeDate(v){

if(v === undefined || v === null) return null;

if(typeof v === "number"){
return excelDateToJS(v);
}

let s = String(v).trim();

if(s === "") return null;

if(s.includes("내원일")) return null;

let d = new Date(s);

if(isNaN(d.getTime())) return null;

return d;

}

function processRows(rows){

let headerIndex = findHeader(rows);

if(headerIndex === -1){
alert("헤더를 찾지 못했습니다");
return;
}

let header = rows[headerIndex];

let chartIndex = header.indexOf("차트번호");
let nameIndex = header.indexOf("수진자명");
let visitIndex = header.indexOf("내원일");

let map = {};

for(let i = headerIndex + 1; i < rows.length; i++){

let r = rows[i];
if(!r) continue;

let chart = r[chartIndex];
let name = r[nameIndex];
let rawDate = r[visitIndex];

if(!chart) continue;

if(String(chart).includes("차트번호")) continue;

let visit = safeDate(rawDate);
if(!visit) continue;

if(!map[chart]){
map[chart] = {
name:name,
visits:[]
};
}

map[chart].visits.push(visit);

}

let result = [];

for(let chart in map){

let visits = map[chart].visits.sort((a,b)=>a-b);

let first = visits[0];
let last = visits[visits.length-1];

result.push({
chart:chart,
name:map[chart].name,
count:visits.length,
first:first ? first.toISOString().slice(0,10) : "",
last:last ? last.toISOString().slice(0,10) : ""
});

}

render(result);

}

function render(data){

const div = document.getElementById("result");

if(data.length === 0){
div.innerHTML="결과 없음";
return;
}

let html="<table>";

html+="<tr>";
html+="<th>차트번호</th>";
html+="<th>수진자명</th>";
html+="<th>방문횟수</th>";
html+="<th>첫 방문</th>";
html+="<th>마지막 방문</th>";
html+="</tr>";

data.forEach(r=>{

let cls = r.count === 1 ? "class='one'" : "";

html+=`
<tr ${cls}>
<td>${r.chart}</td>
<td>${r.name}</td>
<td>${r.count}</td>
<td>${r.first}</td>
<td>${r.last}</td>
</tr>
`;

});

html+="</table>";

div.innerHTML=html;

}

</script>

</body>
</html>
